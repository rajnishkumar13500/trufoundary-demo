version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: actionshield_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: actionshield_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/orders_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
